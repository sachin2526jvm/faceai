<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceAI — Login</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="glow-orb"></div>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="#00e5ff" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4a3 3 0 110 6 3 3 0 010-6zm0 14c-2.67 0-5.03-1.34-6.47-3.36C7.04 14.62 9.41 14 12 14s4.96.62 6.47 1.64C16.03 17.66 13.67 19 12 19z"/></svg></div><div class="logo-text">Face<span>AI</span></div></a>
    <div class="nav-links"><a href="/">Home</a><a href="/about">About</a><a href="/register" class="nav-btn">Register</a></div>
  </div>
</nav>
<div class="page-center">
  <div class="form-card">
    <div class="form-title">Welcome Back 👋</div>
    <div class="form-sub">Login to your FaceAI account</div>
    <div class="alert alert-error" id="error-alert"></div>
    <div class="alert alert-success" id="success-alert"></div>
    <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="email" placeholder="your@email.com"></div>
    <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="password" placeholder="••••••••"></div>
    <button class="submit-btn" id="login-btn" onclick="doLogin()">Login</button>
    <div class="form-footer">Don't have an account? <a href="/register">Register here</a></div>
  </div>
</div>
<script>
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.loggedIn)window.location.href='/';});
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function showError(msg){const el=document.getElementById('error-alert');el.textContent='⚠ '+msg;el.classList.add('visible');document.getElementById('success-alert').classList.remove('visible');}
function showSuccess(msg){const el=document.getElementById('success-alert');el.textContent='✓ '+msg;el.classList.add('visible');document.getElementById('error-alert').classList.remove('visible');}
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password)return showError('Please enter email and password.');
  const btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Logging in...';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok)return showError(data.error||'Login failed.');
    showSuccess('Login successful! Redirecting...');
    setTimeout(()=>window.location.href='/',800);
  }catch{showError('Cannot connect to server.');}
  finally{btn.disabled=false;btn.textContent='Login';}
}
</script>
</body>
</html>
