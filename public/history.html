<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceAI — My History</title>
<link rel="stylesheet" href="/style.css">
<style>
  .page-header { padding: 48px 0 32px; }
  .page-header h1 { font-family:'Syne',sans-serif; font-size:36px; font-weight:800; letter-spacing:-1px; margin-bottom:8px; }
  .page-header p { color:var(--muted); font-size:13px; }
  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:32px; }
  .empty-state { text-align:center; padding:64px 32px; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
  .empty-state h3 { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-bottom:10px; }
  .empty-state p { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .btn-prim { padding:11px 28px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:10px; color:#050810; font-family:'Syne',sans-serif; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .emotion-tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:10px; background:rgba(0,229,255,0.08); border:1px solid rgba(0,229,255,0.15); color:var(--accent); }
</style>
</head>
<body>
<div class="glow-orb"></div>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="#00e5ff" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4a3 3 0 110 6 3 3 0 010-6zm0 14c-2.67 0-5.03-1.34-6.47-3.36C7.04 14.62 9.41 14 12 14s4.96.62 6.47 1.64C16.03 17.66 13.67 19 12 19z"/></svg></div><div class="logo-text">Face<span>AI</span></div></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/history" class="active">History</a>
      <a href="/about">About</a>
      <div id="nav-auth" style="display:none;align-items:center;gap:6px;"><a href="/login">Login</a><a href="/register" class="nav-btn">Register</a></div>
      <div id="nav-user" style="display:none;align-items:center;gap:8px;"><div class="user-chip"><div class="user-dot"></div><span class="username-text"></span></div><button class="logout-btn" onclick="logout()">Logout</button></div>
    </div>
  </div>
</nav>

<div class="container" style="padding-bottom:60px;">
  <div class="page-header">
    <h1>My Analysis <span style="color:var(--accent)">History</span></h1>
    <p>All your past face analyses — results saved automatically after each scan.</p>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div id="content"><div style="text-align:center;padding:48px;color:var(--muted);">Loading...</div></div>
</div>

<footer><div class="container">FaceAI — Powered by <span>SACHIN</span> &nbsp;|&nbsp; @2026</div></footer>

<script src="/nav.js"></script>
<script>
async function init() {
  const me = await fetch('/api/me').then(r=>r.json());
  if (!me.loggedIn) { window.location.href = '/login'; return; }

  const analyses = await fetch('/api/my-analyses').then(r=>r.json());
  const content = document.getElementById('content');
  const statsRow = document.getElementById('stats-row');

  // Stats
  const emotions = analyses.map(a=>a.emotion).filter(e=>e&&e!=='N/A');
  const topEmotion = emotions.length ? emotions.sort((a,b)=>emotions.filter(v=>v===a).length-emotions.filter(v=>v===b).length).pop() : 'N/A';
  statsRow.innerHTML = `
    <div class="card"><div class="card-label">Total Analyses</div><div class="card-value accent">${analyses.length}</div></div>
    <div class="card"><div class="card-label">Most Common Emotion</div><div class="card-value accent3">${topEmotion}</div></div>
    <div class="card"><div class="card-label">Faces Detected</div><div class="card-value accent2">${analyses.reduce((s,a)=>s+(a.facesDetected||0),0)}</div></div>
    <div class="card"><div class="card-label">High Confidence</div><div class="card-value success">${analyses.filter(a=>a.confidence==='High').length}</div></div>
  `;

  if (!analyses.length) {
    content.innerHTML = `<div class="empty-state"><h3>No Analyses Yet</h3><p>You haven't analyzed any faces yet. Start by uploading an image on the home page.</p><a href="/" class="btn-prim">Analyze Now</a></div>`;
    return;
  }

  content.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Date & Time</th><th>Age</th><th>Gender</th><th>Emotion</th><th>Confidence</th><th>Faces</th><th>Summary</th></tr></thead>
        <tbody>${analyses.map((a,i)=>`
          <tr>
            <td style="color:var(--muted)">${analyses.length-i}</td>
            <td>${new Date(a.createdAt).toLocaleString()}</td>
            <td style="color:var(--accent)">${a.age||'N/A'}</td>
            <td>${a.gender||'N/A'}</td>
            <td><span class="emotion-tag">${a.emotion||'N/A'}</span></td>
            <td><span style="color:${a.confidence==='High'?'var(--success)':a.confidence==='Low'?'var(--error)':'var(--warning)'}">${a.confidence||'N/A'}</span></td>
            <td style="color:var(--accent2);text-align:center">${a.facesDetected??0}</td>
            <td style="color:var(--muted);font-size:11px;max-width:200px;">${(a.summary||'').substring(0,80)}${a.summary?.length>80?'...':''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
init();
</script>
</body>
</html>
